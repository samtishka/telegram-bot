name: Docker build & push to Docker Hub

on:
  push:
    branches:
      - develop
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile"
      - "go.*"
      - ".github/workflows/docker-build.yml"
      - "helm/**"

env:
  REGISTRY: docker.io
  IMAGE_NAME: simeontish/telegram-bot

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   

      - name: Set image tag
        id: vars
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}-amd64"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update Helm values tag
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ steps.vars.outputs.tag }}\"/" helm/values.yaml
          grep "tag:" helm/values.yaml

      - name: Commit and push updated Helm values
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml
          git commit -m "Update image tag to ${TAG}" || echo "Nothing to commit"
          git push origin develop
