name: CI/CD Telegram Bot

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Build binary
        run: make build

  helm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint and package chart
        run: |
          helm lint helm
          helm package helm

  deploy:
    runs-on: ubuntu-latest
    needs: helm
    steps:
      - name: Trigger ArgoCD sync (placeholder)
        run: |
          echo "Here we would call ArgoCD to sync the app"
          echo "Example:"
          echo "argocd app sync telegram-bot --grpc-web"
